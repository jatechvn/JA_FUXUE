<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 Silent Learning V1.6 - Ultra Slim</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d4ff; }
        body { background: #0f0c29; color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .panel { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 20px; padding: 40px; text-align: center; border: 1px solid rgba(255,255,255,0.2); max-width: 500px; }
        .btn { display: inline-block; background: var(--primary); color: #fff; padding: 15px 30px; border-radius: 30px; text-decoration: none; font-weight: 800; margin-top: 20px; cursor: move; }
        .hint { display: block; margin-top: 15px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>V1.6 Ultra Slim</h1>
        <p>Phiên bản đã được nén tối đa (< 3.8KB) để đảm bảo hoạt động trên Bookmark.</p>
        <a class="btn" id="dragBtn" href="#">Silent V1.6 Slim</a>
        <span class="hint">Kéo nút này vào thanh Bookmark của bạn 🦞</span>
    </div>
    <script>
        const code = `javascript:(function(){if(window.fuxueActive)return;window.fuxueActive=1;const k=()=>{try{if(window.jQuery)window.jQuery(window).off('blur focus focusout visibilitychange');const b=(e)=>{e.stopImmediatePropagation();e.stopPropagation()};window.addEventListener('blur',b,1);window.addEventListener('focusout',b,1);document.addEventListener('visibilitychange',b,1);Object.defineProperty(document,'hidden',{get:()=>0,configurable:1});Object.defineProperty(document,'visibilityState',{get:()=>'visible',configurable:1});const p=HTMLVideoElement.prototype.pause;HTMLVideoElement.prototype.pause=function(){if(!this.ended&&this.readyState>2)return;return p.apply(this,arguments)}}catch(e){}};k();const h=document.createElement('div');h.style.cssText="padding:10px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);color:#fff;border-radius:15px;font-family:sans-serif;font-size:11px;position:fixed;bottom:20px;right:20px;z-index:9999999;border:1px solid #444;";h.innerHTML='<b style="color:#0df">🦞 SILENT V1.6</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;"><div>M: <span id="h-m">...</span></div><div>S: <span id="h-s">Run</span></div><div>T: <span id="h-v">00:00</span></div><div>L: <span id="h-l">...</span></div></div>';document.body.appendChild(h);const ui=(i,t)=>{const e=document.getElementById('h-'+i);if(e)e.innerText=t};let lT=-1,fS=0,lC=-1,w=0;const hasC=window.wares&&window.wares.some(x=>['pdf','doc','html'].includes(x.type));ui('m',hasC?'HYB':'FAST');new MutationObserver(()=>{const b=document.querySelector('.layui-layer-btn0');if(b){b.click();ui('s','OK')}}).observe(document.body,{childList:1,subtree:1});setInterval(()=>{const v=document.querySelector('video'),a=document.querySelector('dd.active');let pD=0;if(hasC&&w>0){w-=3000;return}if(v){const td=document.querySelector('.vjs-remaining-time-display');if(td&&td.innerText.trim())ui('v',td.innerText.replace('-','').trim());else{const c=Math.floor(v.currentTime);ui('v',Math.floor(c/60)+":"+(c%60).toString().padStart(2,'0'))}}try{if(window.wares&&typeof window.video_index!='undefined'){const c=window.wares[window.video_index];if(c&&['pdf','doc','html'].includes(c.type)){ui('v','DOC');if(c.isComplete!='Y'&&!c._v1){const p={'starttime':c.starttime,'endtime':new Date().getTime()+(window.diff_localTime||0),'playtime':c.page||100,'courseid':window.courseId,'wareid':c.wareId,'chapterid':c.chapterId,'completestatus':'Y','page':c.page||1,'username':window.userName,'versionname':'v1','deviceid':window.courseToken};if(window.encrypt&&window.realSendRecord)window.realSendRecord((window.path||'')+'/public/play/addStudyRecordnew?data='+window.encrypt(JSON.stringify(p)),c.wareId,'v1');c._v1=1;c.isComplete='Y';if(a)a.innerHTML=a.innerHTML.replace(/\\\\d+%/,'')+' Done';pD=1;w=3000}else if(c.isComplete=='Y')pD=1}}}catch(e){}if(v&&v.offsetHeight>5){v.muted=1;v.style.width='1px';v.style.height='1px';if(v.paused&&!v.ended&&!document.querySelector('.layui-layer-btn0')){if(window.videoPlayer)window.videoPlayer.play();v.play().catch(()=>{})}if(!v.paused&&!v.ended){if(Math.abs(v.currentTime-lT)<0.01){fS++;if(fS>10){fS=0;v.currentTime+=1}}else{fS=0;lT=v.currentTime}}}ui('l',a?a.innerText.split(' ')[0]:'N/A');const d=/(Finished|hoàn thành|100%|Done)/i.test(a?a.innerText:\"\")||pD;if(v&&v.ended&&!d){v.currentTime=0;if(window.videoPlayer)window.videoPlayer.play();else v.play()}if((v&&v.ended||d)&&a){const al=Array.from(document.querySelectorAll('dd'));const idx=al.indexOf(a);let nx=null;for(let i=0;i<al.length;i++)if(i>idx&&!/(Finished|hoàn thành|100%|Done)/i.test(al[i].innerText)){nx=al[i];break}if(nx&&lC!=al.indexOf(nx)){lC=al.indexOf(nx);w=hasC?6000:0;const m=nx.getAttribute('onclick')?.match(/dianji\\\\((\\\\d+)/);if(m&&window.dianji)window.dianji(parseInt(m[1]),nx);else nx.click()}else if(!nx&&d)ui('s','Done!')}},3000)})();`;
        document.getElementById('dragBtn').href = code;
    </script>
</body>
</html>
